<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Karma</title>
    <meta name="description" content="Karma">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Noeliz Pernia ASIX1">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="grid-container">

    <nav>
        <div class="logo-nav">
            <img src="./img/karma-logo.svg" alt="Karma Logo">
        </div>
        <div class="adittions">
            <a id="meet" href="#">Meet Karma</a>
            <a href="#">How it Works</a>
            <a href="#">Store</a>
            <a href="#">Blog</a>
            <a href="#">Help</a>
            <a href="#">Login</a>
        </div>
    </nav>
    <div class="banner-container">
        <div class="banner-container-img">
            <img src="./img/first-background.jpg" alt="Banner image">
        </div>
        <div class="banner-text">
            <h2>Introducing Karma!</h2>
            <p>Bring Wifi with you, everywhere you go.</p>
            <button>Learn More</button>
        </div>
    </div>

    <div id="text-card">
        <h2>Everyone needs a little Karma.</h2>
    </div>

    <div class="container-cards">
        <div class="card">
            <div class="container-img"><img src="./img/icon-devices.svg" alt="Card image 1"></div>
            <p>Internet for all devices</p>
        </div>
        <div class="card">
            <div class="container-img"><img src="./img/icon-coffee.svg" alt="Card image 1"></div>
            <p>Boost your productivity</p>
        </div>
        <div class="card">
            <div class="container-img"><img src="./img/icon-refill.svg" alt="Card image 1"></div>
            <p>Pay as You go </p>
        </div>

    </div>
        <hr>
    <footer>
        <p id="join">Join us on</p>
        <div class="icons">
            <div class="twitter-icon">
                <img src="./img/twitter-icon.svg" alt="twitter">
            </div>
            <div class="twitter-icon">
                <img src="./img/facebook-icon.svg" alt="twitter">
            </div>
            <div class="twitter-icon">
                <img src="./img/instagram-icon.svg" alt="twitter">
            </div>
        </div>
        <p id="copy">&copy; Karma Mobility, Inc.</p>
    </footer>

</html>
