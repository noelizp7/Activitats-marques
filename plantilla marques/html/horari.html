<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title> Plantilla </title>
    <meta name="description" content="Plantilla">
    <meta name="author" content="Noeliz Pernia">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/color.css">
</head>

<body>
    <header>
        <h1>Horari</h1>
    </header>

    <main>
        <table border="1">
            <caption></caption>

            <thead>
                <th class="espacio"></th>
                <th class="hora">Dilluns</th>

                <th class="hora">Dimarts</th>
                <th class="hora">Dimecres</th>
                <th class="hora">Dijous</th>
                <th class="hora">Divendres</th>
            </thead>


            <tr>
                <td class="hora">8:00-9:00</td>
                <td class="ASO">ASO</td>
                <td class="BBDD">BBDD</td>
                <td class="HLLD">HLLD</td>
                <td rowspan="2"></td>
                <td class="ASO">ASO</td>
            </tr>

            <tr>
                <td class="hora">9:00-10:00</td>
                <td class="ASO">ASO</td>
                <td class="BBDD">BBDD</td>
                <td class="HLLD">HLLD</td>
                <td class="ASO">ASO</td>

            </tr>

            <tr>
                <td class="hora">10:00-11:00</td>
                <td class="marcas">Marques</td>
                <td class="BBDD">BBDD</td>
                <td class="Tutoria">Tutoria</td>
                <td class="BBDD">BBDD</td>
                <td class="SX">SX</td>
            </tr>


            <tr>
                <td class="hora">11:00-11:30</td>
                <td colspan="5" class="recreo">Recreo</td>

            </tr>

            <tr>
                <td class="hora">11:30-12:30</td>
                <td class="marcas">Marques</td>
                <td class="ISO">ISO</td>
                <td class="FM">FM</td>
                <td class="BBDD">BBDD</td>
                <td class="SX">SX</td>
            </tr>

            <tr>
                <td class="hora">12:30-13:30</td>
                <td class="HLLD">HLLD</td>
                <td class="ISO">ISO</td>
                <td rowspan="2"></td>
                <td class="ISO">ISO</td>
                <td class="FM">FM</td>


            </tr>

            <tr>
                <td class="hora">13:30-14:30</td>
                <td></td>
                <td class="ISO">ISO</td>
                <td></td>
                <td></td>

            </tr>

        </table>
    </main>


</body>

</html>
